[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nagarsaathi"
version = "0.1.0"
description = "NAGARSAATHI civic complaint pilot"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "geoalchemy2>=0.17,<1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2", "pyyaml>=6,<7",
  "PyJWT[crypto]>=2.10,<3", "Pillow>=12,<13",
  "email-validator>=2.2,<3", "google-auth>=2.35,<3", "requests>=2.32,<3", "python-multipart>=0.0.20",
]

[project.optional-dependencies]
ml = ["ultralytics>=8.3,<9", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["services/api/app", "services/worker/worker"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["services/api/app", "services/worker/worker", "scripts"]
