name: nagarsaathi-chaitanya
services:
  app:
    build: .
    image: nagarsaathi-chaitanya:local
    ports:
      - "127.0.0.1:5180:10000"
    volumes:
      - complaint_data:/var/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/api/ready',timeout=5)"]
      start_period: 90s
      interval: 15s
      timeout: 10s
      retries: 4
volumes:
  complaint_data:
